# Visualize kit
> Every block the kit renders, each shown as the source you write and the result you get.
## Shared rules

- A block is a fence: three backticks, the block name, then options (`flag`, `key=value`, `key="two words"`). Inside, one item per line.
- A pipe with spaces around it splits an item into fields. Trailing fields are optional, and text fields take inline Markdown.
- A tone at the end of an item colors it: `{ok}` `{warn}` `{bad}` `{info}` `{accent}` `{muted}`, or `{c1}` to `{c8}` from the chart palette.
- `== Name` starts a group inside a block. `---` splits a block in two. Two spaces of indent nest an item under the one above.
- `title="..."` on a block adds a caption.
- A container is `::: name`, then any source, then `:::`. `== Name` starts each part.
- A fence named for a language (`js`, `python`, `sql`) is highlighted code. `check` reports any other unknown name.
- Nothing needs escaping except a closing script tag, which would end the source: write it `<\/script>`, in prose and in code alike, and it renders without the backslash.
- A fence that holds another fence takes four backticks, so the inner three do not close it.

## Text

Markdown covers headings (`#` is the page title, a `>` right after it is the brief, `##` starts a section), paragraphs, lists, links, tables and images (`![alt](src "caption")` on its own line). Inline extras are written `:name[text]`.

````demo
Plain **bold**, *italic*, `code`, [a link](https://example.com), :kbd[Ctrl+K], :hl[highlight], a :term[hover term|Shown on hover, focus or tap.], badges :ok[passing] :warn[flaky] :bad[failing] :info[beta] :tag[v2.1], a trend :spark[3 5 4 8 12] and math :math[e^{i\pi} + 1 = 0].

> [!tip] Callouts take an optional title
> Kinds: `[!note]` `[!tip]` `[!warn]` `[!danger]` `[!ok]`.

> A quote takes its source on the last line.
> — Grace Hopper

- [x] Task lists
- [~] show
- [ ] status
````

## Tables and charts

A Markdown table renders as written. The `table` block skips the separator row and adds `sort`, `filter` and `bar=Column`. A `*` after a header marks the column that matters, and `✓` `✗` `~` (or `yes` `no` `partial`) become marks. A tone at the end of a row tints the row.

````demo
```table sort filter bar=Latency
Store | Latency | Durable | Ops cost *
Postgres | 4.2 ms | ✓ | Low
Redis | 0.3 ms | ~ | Medium
DynamoDB | 6.8 ms | ✓ | Low
SQLite | 0.9 ms | ✓ | None {ok}
```
````

## Diagrams

```
````

`graph` lays out dependencies from edges: `A -> B: label`, `-->` dashed, `<->` both ways, `--` no arrow, chains allowed. A line without an arrow declares a node: `id: Label | detail {tone}`. `LR` runs left to right.

````demo

api: API gateway {accent}

queue --> mailer

```

## Code

A language fence is highlighted code. Options: `title="path"`, `hl=2,5-7` highlights lines, `nums` numbers them, and `notes` reads everything after a `---` line as `lines: note`.

````demo
```ts title="src/retry.ts" notes
export async function retry<T>(fn: () => Promise<T>, tries = 3): Promise<T> {
  for (let i = 0; ; i++) {
    try { return await fn(); }
    catch (err) { if (i >= tries - 1) throw err; }
    await sleep(2 ** i * 100);
  }
}
---
4: The last failure is rethrown, so callers see the real error.
5: Backoff doubles: 100, 200, 400 ms.
```
````

`diff` colors a unified diff and counts the lines.

````demo
```diff title="src/config.ts"
@@ -12,3 +12,4 @@
 export const config = {
-  timeout: 5000,
+  timeout: 2000,
+  retries: 3,
 };
```
````

## Layout and interaction

`tabs` shows one part at a time; keep it to four or fewer so a phone shows every tab.

````demo
::: tabs
== npm
```sh
npm install @acme/checkout
```
== pnpm
```sh
pnpm add @acme/checkout
```
:::
````

`cols` puts parts side by side (`::: cols 3` fixes the count) and stacks them on a phone. A tone on a part marks it, which makes a before and after.

````demo
::: cols
== Before {bad}
One process handled web, jobs and cron. A slow job stalled checkout.
== After {ok}
Jobs run in their own pool. Checkout p99 dropped from 900 ms to 210 ms.
:::
````

`details` folds a side detail away: `::: details Title`, with `open` to start open.

````demo
::: details Why not a queue per tenant?
At 4,000 tenants the broker spends more time on metadata than on messages.
:::
````

`stepper` walks through parts one at a time, each holding any source.

````demo
::: stepper
== A client sends a write
The leader appends it to its log.
== The leader replicates
```flow
Leader -> Follower A {ok} -> Follower B {ok}
```
== The entry commits
A majority has it, so the leader applies it and answers.
:::
````

`window` frames content as a screen: `::: window Title`, or `url=...` for a browser bar.

````demo
::: window url=https://app.example.com/orders/8841
**Order 8841** :bad[failed]

Card declined. The customer was emailed a retry link.
:::
````

`quiz` checks understanding; the text after the pipe explains each answer.

````demo
```quiz
? A follower stops hearing from the leader. What happens first?
- The cluster stops taking writes | Only until a new leader wins.
+ The follower starts an election | Its election timeout fires and it asks for votes.
```
````

`calc` lets the reader move inputs. Inputs are `name = start | Label | min..max step n | unit`; after `---` comes any source with `{expression}` or `{expression | decimals}` in it.

````demo
```calc
rps = 200 | Requests per second | 10..2000 step 10
kb = 4 | Payload | 1..64 | KB
---
That is **{rps * kb / 1024 | 1} MB/s**, or about **{rps * kb * 86400 / 1048576 | 0} GB** a day.
```
````

`raw` is HTML for what no block covers. Build it from kit parts so it matches: `.card`, `.plate`, `.node`, `.badge`, `.chips`, and tokens for color. A script that needs the rendered page goes after `kit.js` and waits for the `kit:ready` event; `kit.color('accent')` hands a token to canvas code and `kit:theme` fires when the theme changes.

````demo
```raw
<div class="plate" style="display: flex; gap: 1rem; align-items: center; justify-content: center">
  <div class="node" data-tone="accent"><b>Custom</b><small>kit classes</small></div>
  <span class="badge" data-tone="ok">and tokens</span>
</div>
```
````

p { margin: 0 0 1rem; text-wrap: pretty; }

li + li { margin-top: 0.25rem; }
li > ul, li > ol { margin: 0.25rem 0 0; }
a { color: var(--accent); text-decoration-thickness: 1px; text-underline-offset: 0.2em; text-decoration-color: color-mix(in oklab, currentColor 40%, transparent); }
a:hover { text-decoration-color: currentColor; }
b, strong { font-weight: 620; }
small { font-size: 0.875rem; color: var(--muted); }
hr { border: 0; border-top: 1px solid var(--line); margin: 2rem 0; }
img, svg, canvas, video { max-width: 100%; }
img { height: auto; border-radius: var(--r-sm); }
code, kbd, pre, samp { font-family: var(--mono); font-size: 0.875em; }
:not(pre) > code { background: var(--sunk); padding: 0.15em 0.4em; border-radius: 5px; overflow-wrap: anywhere; }
kbd { background: var(--plate); border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 5px; padding: 0.05em 0.4em; white-space: nowrap; }
mark { background: color-mix(in oklab, var(--c4) 38%, transparent); color: inherit; padding: 0.05em 0.15em; border-radius: 3px; }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
.viz-error { background: var(--bad-soft); border: 1.5px solid var(--bad); border-radius: var(--r-sm); padding: 0.5rem 0.75rem; font: 0.875rem var(--mono); }

.btn, .copy, .log-bar button, .stepper-bar button, .quiz button {
  background: var(--card); border: 1px solid var(--line); border-radius: var(--r-sm); box-shadow: var(--shadow);
  padding: 0.3rem 0.7rem; font-size: 0.8125rem; font-weight: 500; min-height: 2rem;
}
.btn:hover, .copy:hover, .log-bar button:hover, .stepper-bar button:hover:not(:disabled), .quiz button:hover { background: var(--hover); }
button:disabled { opacity: 0.45; cursor: default; }

/* page */
.page-head { padding: clamp(3.5rem, 8vw, 5.5rem) 0 clamp(1.5rem, 4vw, 2.5rem); position: relative; }
.page-head h1 { max-width: 22ch; }
.brief p { margin: 0; }
.brief { font-size: clamp(1.0625rem, 1rem + 0.4vw, 1.25rem); line-height: 1.5; color: var(--muted); max-width: 40rem; margin: 1rem 0 0; }
.tools { position: absolute; top: 1rem; inset-inline-end: 0; display: flex; gap: 0.375rem; }
.tools button { width: 2.125rem; height: 2.125rem; padding: 0; display: grid; place-items: center; background: var(--card); border: 1px solid var(--line); border-radius: var(--r); box-shadow: var(--shadow); color: var(--muted); }
.tools button:hover { color: var(--text); background: var(--hover); }
.tools svg { width: 1rem; height: 1rem; }
main { padding-bottom: 5rem; }
main > section { padding: 2.25rem 0 0.5rem; }
main > section + section { border-top: 1px solid var(--line); margin-top: 1.5rem; }
main > section.lead { padding-top: 0; }
main > section > :is(p, ul:not([class]), ol:not([class]), h3, h4, .quote, .callout, .more) { max-width: var(--measure); }
main > section > * + :is(figure, div, table, pre, ul.kpi, ul.cards, ol.steps, ol.timeline, ol.layers, ol.funnel, ul.bars, dl.kv, aside, details) { margin-top: 1.25rem; }
main > section > :is(figure, div, ul.kpi, ul.cards, ol.steps, ol.timeline, ol.layers, ol.funnel, ul.bars, dl.kv, aside, details) { margin-bottom: 1.25rem; }
figure { margin: 0; }
figcaption { font-size: 0.875rem; color: var(--muted); margin-top: 0.5rem; }

.toc { font-size: 0.8125rem; margin-bottom: 1.5rem; }
.toc details { border: 1px solid var(--line); border-radius: var(--r); background: var(--card); box-shadow: var(--shadow); }
.toc summary { display: flex; align-items: center; gap: 0.5rem; padding: 0.5rem 0.75rem; cursor: pointer; font-weight: 600; list-style: none; border-radius: var(--r); }
.toc summary::-webkit-details-marker { display: none; }
.toc summary:hover { background: var(--hover); }
.toc summary svg { width: 1rem; height: 1rem; flex: none; color: var(--muted); }
.toc summary small { margin-inline-start: auto; font-size: 0.75rem; font-weight: 500; font-variant-numeric: tabular-nums; }
.toc details[open] > summary { border-radius: var(--r) var(--r) 0 0; }
.toc details[open] .toc-chev { rotate: 180deg; }
.toc ol { list-style: none; margin: 0; padding: 0.375rem; border-top: 1px solid var(--line); columns: 2 15rem; column-gap: 0.375rem; }
.toc li { margin: 0; break-inside: avoid; }
.toc a { display: block; padding: 0.3rem 0.5rem; border-radius: var(--r-sm); color: var(--muted); text-decoration: none; line-height: 1.4; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.toc a:hover { color: var(--text); background: var(--hover); }
.toc a[aria-current] { color: var(--text); background: var(--hover); }
@media screen and (min-width: 80rem) {
  :root:not(.slides) body:has(> .toc) { grid-template-columns: minmax(1rem, 1fr) minmax(0, var(--page)) 15.5rem minmax(1rem, 1fr); }
  .toc { grid-column: 3; grid-row: 2; position: sticky; top: 1.5rem; align-self: start; margin: 2.25rem 0 0; margin-inline-start: 2.5rem; max-height: calc(100vh - 3rem); overflow: auto; }
  .toc details { border: 0; background: none; box-shadow: none; }
  .toc summary { pointer-events: none; padding: 0 0.5rem 0.5rem; font-size: 0.75rem; color: var(--muted); }
  .toc summary svg { display: none; }
  .toc ol { border: 0; padding: 0; columns: auto; display: grid; gap: 1px; }
  .toc a { white-space: normal; display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2; line-clamp: 2; }
  main { grid-row: 2; }
}

/* shared */
.card, .kpi, .table, .chart-box, .more, .stepper, .calc, .endpoint, .code, .terminal, .log, .json, .filetree, .commits, .kv, .proscons section, .quiz fieldset { box-shadow: var(--shadow); }
.plate {
  background: var(--plate);
  border: 1px solid var(--line); border-radius: var(--r); padding: 1.25rem; container-type: inline-size;
}
.fig > figcaption, .plate + figcaption { margin-top: 0.5rem; }
.scroll { overflow-x: auto; max-width: 100%; }
.badge { display: inline-flex; align-items: center; gap: 0.3em; font-size: 0.8125em; font-weight: 600; line-height: 1.5; padding: 0 0.5em; border-radius: 99px; white-space: nowrap; vertical-align: 0.05em;
  color: var(--tone-ink, var(--muted)); background: color-mix(in oklab, var(--tone, var(--line-strong)) 14%, var(--card)); border: 1px solid color-mix(in oklab, var(--tone, var(--line-strong)) 45%, var(--card)); }
.badge[data-tone]::before { content: ""; width: 0.45em; height: 0.45em; border-radius: 50%; background: currentColor; }
.term { text-decoration: underline dotted var(--line-strong); text-underline-offset: 0.2em; cursor: help; }
.tip { position: fixed; z-index: 50; max-width: min(20rem, calc(100vw - 16px)); background: var(--text); color: var(--bg); font-size: 0.8125rem; line-height: 1.4; padding: 0.35rem 0.6rem; border-radius: var(--r-sm); box-shadow: var(--shadow-lg); }
svg.spark { width: 6rem; height: 1.75rem; overflow: visible; vertical-align: middle; }
p svg.spark, li svg.spark, td svg.spark { width: 4rem; height: 1.1em; }
.kpi svg.spark { width: 6rem; height: 1.75rem; }
.spark path { fill: none; stroke: var(--tone, var(--c1)); stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; vector-effect: non-scaling-stroke; }
.spark .wash { fill: var(--tone, var(--c1)); opacity: 0.1; stroke: none; }
.spark circle { fill: var(--tone, var(--c1)); stroke: var(--card); stroke-width: 2; }
.chips { list-style: none; display: flex; flex-wrap: wrap; gap: 0.375rem; padding: 0; margin: 0; }
.chips li { margin: 0; background: var(--card); border: 1px solid var(--line); border-radius: var(--r-sm); padding: 0.15rem 0.55rem; font-size: 0.875rem; }
.legend { list-style: none; display: flex; flex-wrap: wrap; gap: 0.25rem 1.25rem; padding: 0; margin: 0.75rem 0 0; font-size: 0.875rem; }
.legend li { margin: 0; display: flex; align-items: baseline; gap: 0.4rem; }
.legend i, .sw { flex: none; width: 0.7rem; height: 0.7rem; border-radius: 3px; background: var(--tone, var(--line-strong)); display: inline-block; }
.legend span { color: var(--muted); font-variant-numeric: tabular-nums; }
.data { margin-top: 0.5rem; font-size: 0.875rem; }
.data summary { cursor: pointer; color: var(--muted); width: fit-content; }
.data table { margin-top: 0.5rem; }

/* prose blocks */
.callout { border: 1px solid color-mix(in oklab, var(--tone) 32%, var(--card)); background: color-mix(in oklab, var(--tone) 7%, var(--card)); border-radius: var(--r); padding: 0.875rem 1rem; }
.callout-title { font-weight: 620; color: var(--tone-ink); display: flex; align-items: center; gap: 0.5rem; margin-bottom: 0.25rem; }
.callout-title svg { width: 1.125rem; height: 1.125rem; flex: none; }
.callout > :last-child { margin-bottom: 0; }
.quote { border-inline-start: 2px solid var(--line-strong); padding-inline-start: 1.25rem; }
.quote blockquote { margin: 0; font: 500 1.1875rem/1.45 var(--display); letter-spacing: -0.015em; }
.quote blockquote > :last-child { margin-bottom: 0; }
.task { list-style: none; margin-inline-start: -1.375rem; display: flex; gap: 0.5rem; align-items: baseline; }
.box { flex: none; width: 1.05rem; height: 1.05rem; border: 1.5px solid var(--line-strong); border-radius: 4px; display: inline-grid; place-items: center; font-size: 0.75rem; font-weight: 600; line-height: 1; translate: 0 0.12em; }
.box[data-s="done"] { background: var(--ok); border-color: var(--ok); color: var(--card); }
.box[data-s="doing"] { border-color: var(--info); color: var(--info); }
.box[data-s="blocked"] { border-color: var(--bad); color: var(--bad); }
.more { border: 1px solid var(--line); border-radius: var(--r); background: var(--card); }
.more > summary { cursor: pointer; font-weight: 600; padding: 0.65rem 1rem; }
.more > :not(summary) { margin-inline: 1rem; }
.more > :last-child { margin-bottom: 1rem; }
.fig-img img { display: block; border: 1px solid var(--line); }

/* numbers */
.kpi { list-style: none; padding: 0; display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 9.75rem), 1fr)); gap: 0; border: 1px solid var(--line); border-radius: var(--r); background: var(--card); overflow: hidden; }
.kpi li { margin: 0; padding: 1rem 1.125rem; display: flex; flex-direction: column; gap: 0.15rem; box-shadow: 1px 0 0 var(--line), 0 1px 0 var(--line); }
.kpi-label { font-size: 0.8125rem; font-weight: 500; color: var(--muted); }
.kpi-value { font: 620 1.875rem/1.1 var(--display); letter-spacing: -0.035em; font-variant-numeric: tabular-nums; }
.kpi-row { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 0.25rem 0.5rem; min-height: 1.75rem; }
.kpi-delta { font-size: 0.875rem; font-weight: 600; color: var(--tone-ink, var(--muted)); white-space: nowrap; }
.kpi-note { font-size: 0.8125rem; color: var(--muted); }
.bars { list-style: none; padding: 0; display: grid; grid-template-columns: fit-content(38%) minmax(4rem, 1fr) auto; gap: 0.5rem 0.75rem; align-items: center; }
.bars li { margin: 0; display: grid; grid-template-columns: subgrid; grid-column: 1 / -1; align-items: center; }
.bars-label { font-size: 0.9375rem; }
.bars-label small { display: block; line-height: 1.3; }
.bars-track { height: 0.625rem; display: block; border-radius: 0 4px 4px 0; }
.bars-track i { display: block; height: 100%; width: calc(var(--v) * 100%); min-width: 2px; background: var(--tone, var(--c1)); border-radius: 0 4px 4px 0; }
.bars.meter .bars-track { background: color-mix(in oklab, var(--tone, var(--c1)) 18%, var(--card)); border-radius: 99px; overflow: hidden; }
.bars.meter .bars-track i { border-radius: 99px; }
.bars-val { font-size: 0.875rem; font-weight: 600; font-variant-numeric: tabular-nums; text-align: end; white-space: nowrap; }
.parts-bar { display: flex; gap: 2px; height: 1.75rem; }
.parts-bar i { flex: var(--v) 1 0; min-width: 3px; background: var(--tone); border-radius: 4px; font: 600 0.8125rem/1.75rem var(--font); color: var(--card); padding-inline-start: 0.4rem; overflow: hidden; white-space: nowrap; }
.parts-bar i[data-tone="c4"], .parts-bar i[data-tone="c3"], .parts-bar i[data-tone="c5"] { color: light-dark(#0b0b0b, #ffffff); }
.funnel { list-style: none; padding: 0; display: grid; gap: 0.375rem; }
.funnel li { margin: 0; display: grid; grid-template-columns: minmax(0, 1fr); justify-items: center; text-align: center; }
.funnel-bar { width: max(calc(var(--v) * 100%), 3rem); background: color-mix(in oklab, var(--c1) calc(30% + var(--v) * 70%), var(--card)); border-radius: 4px; height: 1.75rem; }
.funnel-text { font-size: 0.875rem; margin-top: 0.15rem; }
.funnel-text span { color: var(--muted); }

/* tables */
table { border-collapse: collapse; width: 100%; font-size: 0.9375rem; }
th, td { text-align: start; padding: 0.5rem 0.75rem; border-bottom: 1px solid var(--line); vertical-align: top; }
thead th { font-weight: 500; font-size: 0.8125rem; color: var(--muted); white-space: nowrap; vertical-align: bottom; }
.table thead { background: var(--plate); }
tbody tr:last-child > * { border-bottom: 0; }
.num { text-align: end; font-variant-numeric: tabular-nums; white-space: nowrap; }
.table { border: 1px solid var(--line); border-radius: var(--r); background: var(--card); }
.table .scroll { border-radius: var(--r); }
.table-tools { padding: 0.5rem 0.75rem; border-bottom: 1px solid var(--line); display: flex; gap: 0.75rem; align-items: center; font-size: 0.875rem; color: var(--muted); }
.table-tools input { flex: 1; min-width: 0; max-width: 18rem; background: var(--bg); border: 1px solid var(--line-strong); border-radius: var(--r-sm); padding: 0.3rem 0.6rem; }
th button { all: unset; cursor: pointer; display: inline-flex; gap: 0.3rem; align-items: center; }
th button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 3px; }
th button::after { content: "↕"; opacity: 0.45; font-size: 0.8em; }
th[aria-sort="ascending"] button::after { content: "↑"; opacity: 1; color: var(--accent); }
th[aria-sort="descending"] button::after { content: "↓"; opacity: 1; color: var(--accent); }
.key-col { background: color-mix(in oklab, var(--accent) 7%, transparent); }
thead .key-col { color: var(--accent); box-shadow: inset 0 3px 0 var(--accent); }
tr[data-tone] > :first-child { box-shadow: inset 3px 0 0 var(--tone); }
tr[data-tone] { background: color-mix(in oklab, var(--tone) 7%, transparent); }
.yes, .no, .partial { font-weight: 600; white-space: nowrap; }
.yes { color: var(--ok); } .no { color: var(--bad); } .partial { color: var(--warn); }
.cellbar { display: inline-grid; grid-template-columns: auto 4.5rem; gap: 0.5rem; align-items: center; }
.cellbar i { height: 0.5rem; width: calc(var(--v) * 100%); min-width: 2px; background: var(--c1); border-radius: 0 3px 3px 0; }
.heat { border-collapse: separate; border-spacing: 2px; font-size: 0.8125rem; table-layout: fixed; min-width: calc(var(--cols) * 2.4rem + 6rem); }
.heat th, .heat td { border: 0; padding: 0.35rem 0.25rem; }
.heat thead th { text-align: center; font-weight: 600; white-space: normal; }
.heat tbody th { font-weight: 600; width: 6rem; color: var(--muted); }
.heat tbody td { text-align: center; border-radius: 4px; font-variant-numeric: tabular-nums; background: color-mix(in oklab, var(--h, var(--seq)) calc(var(--v) * 94% + 6%), var(--card)); color: #000; }
.heat tbody td.hot { color: #fff; }
.heat tbody td.neg { --h: var(--seq-neg); }
.chart-box { position: relative; height: var(--h, 19rem); border: 1px solid var(--line); border-radius: var(--r); background: var(--card); padding: 0.75rem; }
.kv { display: grid; grid-template-columns: fit-content(35%) 1fr; margin: 0 0 1rem; border: 1px solid var(--line); border-radius: var(--r); background: var(--card); max-width: var(--measure); }
.kv > div { display: grid; grid-template-columns: subgrid; grid-column: 1 / -1; padding: 0.5rem 1rem; gap: 1rem; }
.kv > div + div { border-top: 1px solid var(--line); }
.kv dt { color: var(--muted); font-size: 0.9375rem; }
.kv dd { margin: 0; }

/* cards and lists */
.cards { list-style: none; padding: 0; display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, var(--min, 15rem)), 1fr)); gap: var(--gap); }
.card { margin: 0; background: var(--card); border: 1px solid var(--line); border-radius: var(--r); padding: 1rem 1.125rem; }
.card[data-tone] { box-shadow: inset 0 2px 0 var(--tone), var(--shadow); }
.card h4 { margin-bottom: 0.3rem; }
.card h4 a { color: inherit; }
.card-body { font-size: 0.9375rem; color: var(--muted); }
.card-body > :last-child { margin-bottom: 0; }
.card-meta { margin-top: 0.6rem; font-size: 0.8125rem; color: var(--muted); }
.steps { list-style: none; padding: 0; counter-reset: step; max-width: var(--measure); }
.steps > li { counter-increment: step; position: relative; margin: 0; padding: 0 0 1.25rem 2.75rem; }
.steps > li::before { content: counter(step); position: absolute; inset-inline-start: 0; top: -0.05rem; width: 1.75rem; height: 1.75rem; display: grid; place-items: center; border: 1px solid var(--line); border-radius: 50%; font: 600 0.8125rem var(--font); font-variant-numeric: tabular-nums; background: var(--sunk); }
.steps > li:not(:last-child)::after { content: ""; position: absolute; inset-inline-start: calc(0.875rem - 0.5px); top: 1.95rem; bottom: 0.2rem; border-inline-start: 1px solid var(--line); }
.steps > li[data-tone]::before { border-color: var(--tone); background: var(--tone); color: var(--card); }
.steps div, .timeline div { color: var(--muted); font-size: 0.9375rem; }
.steps div > :last-child, .timeline div > :last-child { margin-bottom: 0; }
.timeline { list-style: none; padding: 0; max-width: var(--measure); }
.timeline > li { position: relative; margin: 0; padding: 0 0 1.25rem 1.75rem; }
.timeline > li::before { content: ""; position: absolute; inset-inline-start: 0; top: 0.4rem; width: 0.75rem; height: 0.75rem; border-radius: 50%; background: var(--tone, var(--bg)); border: 2px solid var(--tone, var(--line-strong)); }
.timeline > li:not(:last-child)::after { content: ""; position: absolute; inset-inline-start: calc(0.375rem - 0.5px); top: 1.4rem; bottom: -0.2rem; border-inline-start: 1px solid var(--line); }
.timeline time { display: block; font-size: 0.8125rem; font-weight: 600; color: var(--muted); font-variant-numeric: tabular-nums; }
.checklist-head { display: flex; align-items: center; gap: 0.75rem; font-size: 0.875rem; font-weight: 600; margin-bottom: 0.6rem; max-width: var(--measure); }
.checklist-head i { flex: 1; height: 0.5rem; border-radius: 99px; background: linear-gradient(to right, var(--ok) calc(var(--v) * 100%), color-mix(in oklab, var(--ok) 18%, var(--card)) 0); }
.checklist ul { list-style: none; padding: 0; margin: 0; max-width: var(--measure); }
.checklist li { display: flex; gap: 0.6rem; align-items: baseline; padding: 0.35rem 0; margin: 0; border-bottom: 1px solid var(--line); }
.checklist li[data-s="done"] > span:nth-child(2) { color: var(--muted); }
.checklist li small { margin-inline-start: auto; text-align: end; }
.proscons { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 16rem), 1fr)); gap: var(--gap); }
.proscons section { background: var(--card); border: 1px solid var(--line); border-radius: var(--r); padding: 1rem 1.125rem; }
.proscons h4 { margin-bottom: 0.5rem; }
.proscons ul { list-style: none; padding: 0; margin: 0; font-size: 0.9375rem; }
.proscons li { display: flex; gap: 0.5rem; margin: 0; padding: 0.2rem 0; }
.proscons li > b { flex: none; width: 1.1rem; text-align: center; color: var(--tone-ink); }
.proscons.split { grid-template-columns: repeat(auto-fit, minmax(min(100%, 16rem), 1fr)); }
.kanban { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(13.5rem, 1fr); gap: var(--gap); padding-bottom: 0.25rem; }
.kanban section { background: var(--sunk); border-radius: var(--r); padding: 0.625rem; box-shadow: inset 0 2px 0 var(--tone, transparent); }
.kanban h4 { display: flex; justify-content: space-between; align-items: baseline; padding: 0.125rem 0.375rem 0.5rem; font-size: 0.9375rem; }
.kanban h4 span { color: var(--muted); font-weight: 600; font-size: 0.8125rem; }
.kanban ul { list-style: none; padding: 0; margin: 0; display: grid; gap: 0.5rem; }
.kanban .card { padding: 0.6rem 0.75rem; font-size: 0.9375rem; border-radius: var(--r-sm); }
.kanban .card[data-tone] { box-shadow: var(--shadow); border-inline-start: 3px solid var(--tone); }

/* diagrams */
.node { background: var(--card); box-shadow: var(--shadow); border: 1px solid var(--line-strong); border-radius: var(--r-sm); padding: 0.45rem 0.8rem; font-size: 0.9375rem; line-height: 1.3; text-align: center; min-width: 0; }
.node b { display: block; font-weight: 600; }
.node small { display: block; font-size: 0.8125rem; }
.node[data-tone] { border-color: var(--tone); background: color-mix(in oklab, var(--tone) 12%, var(--card)); }
.flow { list-style: none; padding: 0; margin: 0; display: flex; flex-wrap: wrap; align-items: stretch; justify-content: center; gap: 0.75rem 0; }
.flow + .flow { margin-top: 1rem; }
.flow > li { margin: 0; display: flex; align-items: center; }
.flow .node { align-self: stretch; display: flex; flex-direction: column; justify-content: center; max-width: 13rem; }
.flow > li + li::before { content: ""; width: 1.75rem; height: 0.7rem; flex: none; background: var(--line-strong); clip-path: polygon(0 42%, 68% 42%, 68% 0, 100% 50%, 68% 100%, 68% 58%, 0 58%); margin-inline: 0.25rem; }
[dir="rtl"] .flow > li + li::before { scale: -1 1; }
@container (max-width: 34rem) {

  const topLevel = (lines, fn) => {
    let fence = null, depth = 0;
    lines.forEach((ln, i) => {
      if (fence) { if (fence.test(ln)) fence = null; return; }
      const f = FENCE.exec(ln);
      if (f) { fence = fenceEnd(f); return; }
      if (/^:::\s*\w/.test(ln)) depth++;
      else if (/^:::\s*$/.test(ln)) depth--;
      else if (!depth) fn(ln, i);
    });
  };
  const parts = (lines, line0) => {
    const cuts = [];
    topLevel(lines, (ln, i) => { if (/^==+(\s|$)/.test(ln)) cuts.push(i); });
    const out = [];
    const take = (from, to, head) => {
      const [t, tn] = tone(head.replace(/^==+\s*/, '').replace(/\s*=+\s*$/, ''));
      const text = lines.slice(from, to).join('\n');
      if (t || text.trim()) out.push({ title: t, tone: tn, nodes: render(text, line0 + from) });
    };
    take(0, cuts.length ? cuts[0] : lines.length, '');
    cuts.forEach((c, k) => take(c + 1, cuts[k + 1] ?? lines.length, lines[c]));
    return out;
  };

  const listHtml = ls => {
    let i = 0;
    const build = indent => {
      const ordered = ls[i].ordered;
      let h = '';
      while (i < ls.length && ls[i].indent >= indent) {
        if (ls[i].indent > indent) { h = h.replace(/<\/li>$/, '') + build(ls[i].indent) + '</li>'; continue; }
        const it = ls[i++];
        const t = /^\[([ xX~!])\]\s+(.*)$/.exec(it.text);
        const s = t && { ' ': 'todo', x: 'done', X: 'done', '~': 'doing', '!': 'blocked' }[t[1]];
        h += t ? `<li class="task"><span class="box" data-s="${s}" role="img" aria-label="${esc(L[s])}">${{ done: '✓', doing: '–', blocked: '!', todo: '' }[s]}</span><span>${md(t[2])}</span></li>` : `<li>${md(it.text)}</li>`;
      }
      return (ordered ? '<ol>' : '<ul>') + h + (ordered ? '</ol>' : '</ul>');
    };
    return build(ls[0].indent);
  };

  const render = (text, line0 = 0) => {
    const lines = String(text).replace(/\r/g, '').split('\n');
    const out = [];
    const push = x => { if (x == null || x === '') return; if (typeof x === 'string') { const t = d.createElement('template'); t.innerHTML = x.trim(); out.push(...[...t.content.children].map(fill)); } else out.push(x); };
    const isStart = ln => !ln.trim() || /^(#{1,4}\s|>|`{3,}|~{3,}|:::|\||---+\s*$|!\[)/.test(ln) || /^\s*([-*+]|\d+[.)])\s+/.test(ln) || BLOCK_TAG.test(ln);
    let i = 0;
    while (i < lines.length) {
      const ln = lines[i], at = line0 + i + 1;
      let m;
      if (!ln.trim()) { i++; continue; }
      if ((m = FENCE.exec(ln))) {
        const close = fenceEnd(m);
        let j = i + 1;
        while (j < lines.length && !close.test(lines[j])) j++;
        if (j >= lines.length) push(fail(`line ${at}: ${m[1]}${m[2]} block is never closed`));
        push(block(m[2], m[3], lines.slice(i + 1, j).join('\n'), at));
        i = j + 1; continue;
      }
      if ((m = /^:::\s*(\w[\w-]*)\s*(.*)$/.exec(ln))) {
        let depth = 1, j = i + 1, fence = null;
        for (; j < lines.length; j++) {
          const t = lines[j];
          if (fence) { if (fence.test(t)) fence = null; continue; }
          const f = FENCE.exec(t);
          if (f) { fence = fenceEnd(f); continue; }
          if (/^:::\s*\w/.test(t)) depth++;
          else if (/^:::\s*$/.test(t) && !--depth) break;
        }
        if (j >= lines.length) push(fail(`line ${at}: ::: ${m[1]} is never closed`));
        const name = m[1].toLowerCase();
        if (!Object.hasOwn(C, name)) push(fail(`line ${at}: unknown container "${name}"`));
        else push(run(() => C[name](parts(lines.slice(i + 1, j), at), opts(m[2]), m[2])));
        i = j + 1; continue;
      }
      if ((m = /^(#{1,4})\s+(.*?)\s*#*$/.exec(ln))) {
        const id = /\s*\{#([\w-]+)\}$/.exec(m[2]);
        push(`<h${m[1].length}${id ? ` id="${id[1]}"` : ''}>${md(id ? m[2].slice(0, id.index) : m[2])}</h${m[1].length}>`);
        i++; continue;
      }
      if (/^---+\s*$/.test(ln)) { push('<hr>'); i++; continue; }
      if (/^>/.test(ln)) {
        const q = [];
        while (i < lines.length && /^>/.test(lines[i])) q.push(lines[i++].replace(/^>\s?/, ''));
        if ((m = /^\[!(\w+)\]\s*(.*)$/.exec(q[0]))) {
          const kind = m[1].toLowerCase(), tn = CALLOUT[kind] || 'info';
          const label = { info: L.note, accent: kind === 'tip' ? L.tip : L.key, warn: L.warn, bad: L.bad, ok: L.ok }[tn];
          push(`<aside class="callout" data-tone="${tn}"><div class="callout-title">${icon(tn)}<span>${m[2] ? md(m[2]) : esc(label)}</span></div>${slot(render(q.slice(1).join('\n'), at))}</aside>`);
        } else {
          const by = /^(?:—|--)\s*(.+)$/.exec(q[q.length - 1]);
          if (by) q.pop();
          push(`<figure class="quote"><blockquote>${slot(render(q.join('\n'), at - 1))}</blockquote>${by ? `<figcaption>${md(by[1])}</figcaption>` : ''}</figure>`);
        }
        continue;
      }
      if (/^\s*([-*+]|\d+[.)])\s+/.test(ln)) {
        const ls = [];
        for (; i < lines.length && lines[i].trim(); i++) {
          const t = /^(\s*)([-*+]|\d+[.)])\s+(.*)$/.exec(lines[i]);
          if (t) ls.push({ indent: t[1].replace(/\t/g, '  ').length, ordered: /\d/.test(t[2]), text: t[3] });
          else if (/^\s+\S/.test(lines[i])) ls[ls.length - 1].text += ' ' + lines[i].trim();
          else break;
        }
        push(listHtml(ls)); continue;
      }
      if (/^\|/.test(ln)) {
        const t = [];
        while (i < lines.length && /^\|/.test(lines[i])) t.push(lines[i++]);
        push(block('table', '', t.join('\n'), at)); continue;
      }
      if ((m = /^!\[([^\]]*)\]\((\S+?)(?:\s+"([^"]*)")?\)\s*$/.exec(ln))) {
        push(`<figure class="fig-img"><img alt="${esc(m[1])}" src="${esc(m[2])}">${m[3] ? `<figcaption>${md(m[3])}</figcaption>` : ''}</figure>`);
        i++; continue;
      }
      if (BLOCK_TAG.test(ln)) {
        const h = [];
        while (i < lines.length && lines[i].trim()) h.push(lines[i++]);
        push(h.join('\n')); continue;
      }
      const p = [ln];
      for (i++; i < lines.length && !isStart(lines[i]); i++) p.push(lines[i]);
      push(`<p>${md(p.join('\n'))}</p>`);
    }
    return out;
  };

  /* ---------- containers ---------- */
  const C = {};
  let uid = 0;
  C.tabs = ps => {
    const t = ++uid, box = el('<div class="tabs"><div role="tablist"></div></div>'), list = box.firstElementChild;
    const panels = ps.map((p, i) => {
      const s = el(`<section role="tabpanel" id="tabp-${t}-${i}" aria-labelledby="tab-${t}-${i}" tabindex="0"></section>`);
      s.append(...p.nodes); box.append(s); return s;
    });
    const btns = ps.map((p, i) => {
      const b = el(`<button type="button" role="tab" id="tab-${t}-${i}" aria-controls="tabp-${t}-${i}">${md(p.title || String(i + 1))}</button>`);
      b.addEventListener('click', () => pick(i));
      list.append(b); return b;
    });
    const pick = (i, focus) => {
      btns.forEach((b, j) => { b.setAttribute('aria-selected', String(i === j)); b.tabIndex = i === j ? 0 : -1; panels[j].hidden = i !== j; });
      if (focus) btns[i].focus();
      d.dispatchEvent(new Event('kit:shown'));
    };
    list.addEventListener('keydown', e => {
      const i = btns.indexOf(d.activeElement), rtl = getComputedStyle(box).direction === 'rtl';
      const step = { ArrowRight: rtl ? -1 : 1, ArrowLeft: rtl ? 1 : -1 }[e.key];
      const to = e.key === 'Home' ? 0 : e.key === 'End' ? btns.length - 1 : step ? (i + step + btns.length) % btns.length : null;
      if (to === null) return;
      e.preventDefault(); pick(to, true);
    });
    pick(0);
    return box;
  };
  C.cols = (ps, o) => {
    const box = el(`<div class="cols" style="--cols:${+o._[0] || ps.length || 1}"></div>`);
    ps.forEach(p => { const c = el(`<div class="col"${tonal(p.tone)}>${p.title ? `<h4>${md(p.title)}</h4>` : ''}</div>`); c.append(...p.nodes); box.append(c); });
    return box;
  };
  C.details = (ps, o, raw) => {
    const title = raw.replace(/(^|\s)open(\s|$)/, ' ').trim() || 'Details';
    const box = el(`<details class="more"${o.open ? ' open' : ''}><summary>${md(title)}</summary></details>`);
    ps.forEach(p => box.append(...p.nodes));
    return box;
  };
  C.window = (ps, o, raw) => {
    const title = o.title || raw.replace(/\b(url|title)=("[^"]*"|\S+)/g, '').trim();
    const box = el(`<figure class="window"><div class="window-bar">${o.url ? `<span class="url">${esc(o.url)}</span>` : `<span>${md(title)}</span>`}</div><div class="window-body"></div></figure>`);
    ps.forEach(p => box.lastElementChild.append(...p.nodes));
    return box;
  };
  C.stepper = ps => {
    const box = el(`<div class="stepper"><div class="stepper-bar"><button type="button">${esc(L.back)}</button><output aria-live="polite"></output><button type="button">${esc(L.next)}</button></div></div>`);
    const [prev, out, next] = box.firstElementChild.children;
    const panes = ps.map(p => { const s = el(`<div class="stepper-pane">${p.title ? `<h4>${md(p.title)}</h4>` : ''}</div>`); s.append(...p.nodes); box.firstElementChild.before(s); return s; });
    let cur = 0;
    const show = i => {
      cur = Math.max(0, Math.min(i, panes.length - 1));
      panes.forEach((p, j) => { p.hidden = j !== cur; });
      out.textContent = say('step', { n: cur + 1, total: panes.length });
      const lost = d.activeElement === prev || d.activeElement === next;
      prev.disabled = cur === 0; next.disabled = cur === panes.length - 1;
      if (lost && d.activeElement.disabled) (prev.disabled ? next : prev).focus();
      d.dispatchEvent(new Event('kit:shown'));
    };
    prev.addEventListener('click', () => show(cur - 1));
    next.addEventListener('click', () => show(cur + 1));
    show(0);
    return box;
  };
  B.demo = body => {
    const box = el('<div class="demo"><div class="demo-out"></div></div>');
    box.firstElementChild.append(...render(body));
    box.append(B.code(body, { _: [] }, 'viz'));
    return box;
  };

  /* ---------- libraries, theme, color ---------- */
  const CDN = 'https://cdn.jsdelivr.net/npm/';
  const LIBS = {
    katex: { js: 'katex@0.16/dist/katex.min.js', css: 'katex@0.16/dist/katex.min.css', global: 'katex' },
    chart: { js: 'chart.js@4/dist/chart.umd.min.js', global: 'Chart' },
    mermaid: { esm: 'mermaid@11/dist/mermaid.esm.min.mjs' },
  };
  const script = src => new Promise((ok, no) => { const s = d.createElement('script'); s.src = src; s.onload = ok; s.onerror = no; d.head.append(s); });
  const libs = {};
  const load = name => libs[name] ||= (async () => {
    const lib = LIBS[name];
    if (lib.css) d.head.append(Object.assign(d.createElement('link'), { rel: 'stylesheet', href: CDN + lib.css }));
    if (lib.esm) return (await import(CDN + lib.esm)).default;
    await script(CDN + lib.js);
    return window[lib.global];
  })();
  const family = name => getComputedStyle(root).getPropertyValue(name).trim();
  const fontsReady = () => Promise.race([
    Promise.all([family('--font'), family('--display'), family('--mono')].map(f => d.fonts.load('1em ' + f.split(',')[0]))).catch(() => {}),
    new Promise(ok => setTimeout(ok, 2500)),
  ]);
  const probe = d.createElement('i');
  probe.hidden = true;
  const px = d.createElement('canvas').getContext('2d', { willReadFrequently: true });
  const rgbOf = css => { px.clearRect(0, 0, 1, 1); px.fillStyle = css; px.fillRect(0, 0, 1, 1); return [...px.getImageData(0, 0, 1, 1).data.slice(0, 3)]; };
  const color = (name, scheme = '') => {
    if (!probe.isConnected) d.body.append(probe);
    probe.style.colorScheme = scheme;
    probe.style.color = `var(--${name.replace(/^--/, '')})`;
    return '#' + rgbOf(getComputedStyle(probe).color).map(v => v.toString(16).padStart(2, '0')).join('');
  };
  const lum = css => { const [r, g, b] = rgbOf(css).map(v => { v /= 255; return v <= 0.04045 ? v / 12.92 : ((v + 0.055) / 1.055) ** 2.4; }); return 0.2126 * r + 0.7152 * g + 0.0722 * b; };
  const dark = matchMedia('(prefers-color-scheme: dark)');
  const theme = () => root.dataset.theme || (dark.matches ? 'dark' : 'light');
  const themed = [];
  const changed = () => { themed.forEach(fn => run(fn)); d.dispatchEvent(new CustomEvent('kit:theme', { detail: theme() })); };

  /* ---------- numbers ---------- */
  B.kpi = body => `<ul class="kpi">${rows(body).map(r => {
    const [label, value = '', ...rest] = r.f;
    let delta = '', sp = '', note = '';
    rest.forEach(x => { if (!x) return; if (!sp && isSeries(x)) sp = x; else if (!delta && /^[+\-−▲▼±]/.test(x)) delta = x; else note = x; });
    const dir = /^[-−▼]/.test(delta) ? 'down' : /^±/.test(delta) ? '' : 'up';
    return `<li><span class="kpi-label">${md(label)}</span><span class="kpi-value">${md(value)}</span>` +
      (delta || sp ? `<span class="kpi-row">${delta ? `<span class="kpi-delta"${tonal(r.tone)}>${{ up: '↑', down: '↓', '': '→' }[dir]} ${esc(delta.replace(/^[+\-−▲▼±]\s*/, ''))}${dir ? `<span class="sr"> ${esc(L[dir])}</span>` : ''}</span>` : '<span></span>'}${sp ? spark(sp, r.tone) : ''}</span>` : '') +
      (note ? `<span class="kpi-note">${md(note)}</span>` : '') + '</li>';
  }).join('')}</ul>`;

  const barList = (body, o, meter) => {
    const rs = rows(body).map(r => {
      const [label, value = '', a = '', b = ''] = r.f;
      const frac = /^(.+?)\s*\/\s*(.+)$/.exec(value);
      return { label, value, note: meter && !frac && a && !isNaN(num(a)) ? b : a, v: num(frac ? frac[1] : value), cap: frac ? num(frac[2]) : meter && a && !isNaN(num(a)) ? num(a) : /%/.test(value) ? 100 : NaN, tone: r.tone };
    });
    const top = +o.max || Math.max(...rs.map(r => r.v).filter(v => !isNaN(v)), 0) || 1;
    return `<ul class="bars${meter ? ' meter' : ''}">${rs.map(r => {
      const cap = meter ? (isNaN(r.cap) ? top : r.cap) : top, v = Math.max(0, Math.min(1, (r.v || 0) / cap));
      return `<li${tonal(r.tone)}><span class="bars-label">${md(r.label)}${r.note ? `<small>${md(r.note)}</small>` : ''}</span><span class="bars-track"${meter ? ` role="meter" aria-valuemin="0" aria-valuemax="${cap}" aria-valuenow="${r.v || 0}" aria-label="${esc(r.label)}"` : ''}><i style="--v:${v.toFixed(4)}"></i></span><span class="bars-val">${md(r.value)}</span></li>`;
    }).join('')}</ul>`;
  };
  B.bars = (body, o) => barList(body, o, false);
  B.meter = (body, o) => barList(body, o, true);

  B.parts = body => {
    let rs = rows(body).map(r => ({ label: r.f[0], text: r.f[1] ?? '', v: num(r.f[1] ?? r.f[0]) || 0, tone: r.tone }));
    if (rs.length > 8) { const rest = rs.slice(7); rs = [...rs.slice(0, 7), { label: L.other, v: rest.reduce((s, r) => s + r.v, 0), text: '', tone: 'muted' }]; rs[7].text = fmt(rs[7].v); }
    const total = rs.reduce((s, r) => s + r.v, 0) || 1;
    const pct = v => { const p = v / total * 100; return (p > 0 && p < 1 ? '<1' : Math.round(p)) + '%'; };
    rs.forEach((r, i) => { r.tone ||= 'c' + (i + 1); });
    const fig = el(`<figure class="parts"><div class="parts-bar" role="img" aria-label="${esc(rs.map(r => `${r.label} ${pct(r.v)}`).join(', '))}">${rs.map(r => `<i style="--v:${r.v}"${tonal(r.tone)} data-t="${pct(r.v)}" title="${esc(r.label)}: ${esc(r.text)} (${pct(r.v)})"></i>`).join('')}</div><ul class="legend">${rs.map(r => `<li><i${tonal(r.tone)}></i>${md(r.label)} <span>${md(r.text)} · ${pct(r.v)}</span></li>`).join('')}</ul></figure>`);
    const bar = fig.firstElementChild;
    onSize(bar, () => [...bar.children].forEach(s => { s.textContent = s.dataset.t; if (s.scrollWidth > s.clientWidth) s.textContent = ''; }));
    return fig;
  };

  B.funnel = body => {
    const rs = rows(body).map(r => ({ label: r.f[0], text: r.f[1] ?? '', v: num(r.f[1]) || 0, note: r.f[2] || '' }));
    const top = Math.max(...rs.map(r => r.v)) || 1;
    return `<ol class="funnel">${rs.map((r, i) => `<li><span class="funnel-bar" style="--v:${(r.v / top).toFixed(4)}"></span><span class="funnel-text"><b>${md(r.label)}</b> ${md(r.text)}${i && rs[i - 1].v ? ` <span>${esc(say('ofPrev', { p: Math.round(r.v / rs[i - 1].v * 100) + '%' }))}</span>` : ''}${r.note ? ` <span>${md(r.note)}</span>` : ''}</span></li>`).join('')}</ol>`;
  };

  B.kv = body => `<dl class="kv">${rows(body).map(r => `<div><dt>${md(r.f[0])}</dt><dd>${md(r.f.slice(1).join(' | '))}</dd></div>`).join('')}</dl>`;

  /* ---------- tables and charts ---------- */
  const GAP = /^[\s—–?−-]*$|^n\/?a$/i;
  const NUMISH = /^\D{0,3}?[−+-]?\d[\d,.\s]*(e[+-]?\d+)?\s*\D{0,5}$/i;
  const SEP = r => !/^[\s|:-]+$/.test(r.raw);
  const grid = body => {
    const rs = rows(body).filter(SEP);
    if (rs.length < 2) throw new Error('needs a header row and at least one data row');
    const head = rs.shift().f.map(h => { const key = /\*$/.test(h); const [t, tn] = tone(key ? h.slice(0, -1).trim() : h); return { text: t, key, tone: tn }; });
    const cells = rs.map(r => head.map((_, j) => r.f[j] ?? ''));
    const isNum = head.map((_, j) => { const v = cells.map(r => r[j]).filter(s => !GAP.test(s)); return v.length > 0 && v.every(s => NUMISH.test(s)); });
    return { head, cells, isNum, tones: rs.map(r => r.tone) };
  };
  const mark = s => /^(✓|✔|yes)$/i.test(s) ? ['yes', '✓'] : /^(✗|✘|no)$/i.test(s) ? ['no', '✗'] : /^(~|partial|partly)$/i.test(s) ? ['partial', '~'] : null;
  B.table = (body, o) => {
    const { head, cells, isNum, tones } = grid(body);
    const bars = String(o.bar || '').split(',').map(s => s.trim()).filter(Boolean).map(s => /^\d+$/.test(s) ? s - 1 : head.findIndex(h => h.text.toLowerCase() === s.toLowerCase()));
    const max = head.map((_, j) => Math.max(...cells.map(r => Math.abs(num(r[j])) || 0)));
    const cell = (s, j) => {
      const k = mark(s);
      if (k) return `<span class="${k[0]}">${k[1]}${s.length > 1 ? ' ' + esc(s) : `<span class="sr"> ${esc(L[k[0]])}</span>`}</span>`;
      if (bars.includes(j) && isNum[j]) return `<span class="cellbar"><span>${md(s)}</span><i style="--v:${(Math.abs(num(s)) / (max[j] || 1)).toFixed(3)}"></i></span>`;
      return md(s);
    };
    const cls = j => { const c = [isNum[j] && j > 0 ? 'num' : '', head[j].key ? 'key-col' : ''].filter(Boolean).join(' '); return c ? ` class="${c}"` : ''; };
    const box = el(`<div class="table">${o.filter ? `<div class="table-tools"><input type="search" placeholder="${esc(L.filter)}" aria-label="${esc(L.filter)}"><span aria-live="polite"></span></div>` : ''}<div class="scroll"><table><thead><tr>${head.map((h, j) => `<th scope="col"${cls(j)}>${o.sort ? `<button type="button">${md(h.text)}</button>` : md(h.text)}</th>`).join('')}</tr></thead><tbody>${cells.map((r, i) => `<tr${tonal(tones[i])}>${r.map((c, j) => `<td${cls(j)}>${cell(c, j)}</td>`).join('')}</tr>`).join('')}</tbody></table></div></div>`);
    const tbody = box.querySelector('tbody'), trs = [...tbody.rows];
    trs.forEach((tr, i) => { tr.kitRow = cells[i]; });
    if (o.sort) $$('th', box).forEach((th, j) => th.firstElementChild.addEventListener('click', () => {
      const dir = th.getAttribute('aria-sort') === 'ascending' ? -1 : 1;
      $$('th', box).forEach(x => x.removeAttribute('aria-sort'));
      th.setAttribute('aria-sort', dir > 0 ? 'ascending' : 'descending');
      tbody.append(...[...tbody.rows].sort((a, b) => dir * (isNum[j] ? (num(a.kitRow[j]) || 0) - (num(b.kitRow[j]) || 0) : a.kitRow[j].localeCompare(b.kitRow[j], root.lang || undefined, { numeric: true }))));
    }));
    if (o.filter) {
      const input = box.querySelector('input'), count = input.nextElementSibling;
      input.addEventListener('input', () => {
        const q = input.value.trim().toLowerCase();
        let n = 0;
        trs.forEach(tr => { tr.hidden = !!q && !tr.textContent.toLowerCase().includes(q); if (!tr.hidden) n++; });
        count.textContent = q ? say('rows', { n, total: trs.length }) : '';
      });
    }
    return box;
  };

  B.heatmap = (body, o) => {
    const { head, cells } = grid(body);
    const vals = cells.flatMap(r => r.slice(1).map(num)).filter(v => !isNaN(v));

    const curve = (i, j) => `<path d="M${X(cs[i])} ${Y(i)}C${X(cs[i])} ${(Y(i) + Y(j)) / 2} ${X(cs[j])} ${(Y(i) + Y(j)) / 2} ${X(cs[j])} ${Y(j)}" data-tone="${lanes.indexOf(cs[i].branch) ? 'c' + (lanes.indexOf(cs[i].branch) % 8 + 1) : 'c1'}"/>`;
    lanes.forEach((b, k) => {
      const idx = cs.map((c, i) => c.branch === b ? i : -1).filter(i => i >= 0);
      if (!idx.length) return;
      const tn = 'c' + (k % 8 + 1), first = idx[0], last = idx[idx.length - 1];
      if (last > first) svg += `<line x1="${10 + k * G}" y1="${Y(first)}" x2="${10 + k * G}" y2="${Y(last)}" data-tone="${tn}"/>`;
      if (k) { const parent = cs.findIndex((c, i) => i > last && c.branch === base); if (parent >= 0) svg += curve(last, parent); }
    });
    cs.forEach((c, i) => { if (!c.from) return; const src = cs.findIndex((x, j) => j > i && x.branch === c.from); if (src >= 0) svg += curve(src, i).replace(/data-tone="[^"]*"/, `data-tone="c${lanes.indexOf(c.from) % 8 + 1}"`); });
    cs.forEach((c, i) => { svg += `<circle cx="${X(c)}" cy="${Y(i)}" r="${c.from ? 5.5 : 4.5}" data-tone="c${lanes.indexOf(c.branch) % 8 + 1}"/>`; });
    const seen = new Set();
    return `<figure class="commits" style="--pad:${W}px"><svg width="${W}" height="${cs.length * H}" aria-hidden="true">${svg}</svg><ol>${cs.map(c => { const tip = !seen.has(c.branch); seen.add(c.branch); return `<li>${c.hash ? `<span class="c-hash">${esc(c.hash.slice(0, 7))}</span>` : ''}${tip ? `<span class="c-ref" data-tone="c${lanes.indexOf(c.branch) % 8 + 1}">${esc(c.branch)}</span>` : `<span class="sr">${esc(c.branch)}: </span>`}<span class="c-msg">${md(c.msg)}</span>${c.meta ? `<span class="c-meta">${md(c.meta)}</span>` : ''}</li>`; }).join('')}</ol></figure>`;
  };

  B.raw = body => { const box = d.createElement('div'); box.className = 'raw'; box.innerHTML = body; return box; };
  B.math = body => `<div class="math">${esc(body.trim())}</div>`;
  B.mermaid = body => { const pre = d.createElement('pre'); pre.className = 'mermaid'; pre.textContent = body; pre.dataset.src = body; return pre; };

  /* ---------- lazy libraries: math, mermaid ---------- */
  const scrollable = node => { if (node.scrollWidth > node.clientWidth + 1 && !node.hasAttribute('tabindex')) { node.tabIndex = 0; if (!node.hasAttribute('role')) { node.setAttribute('role', 'region'); node.setAttribute('aria-label', L.scroll); } } };
  const doMath = () => {
    const maths = $$('.math:not([data-tex])');
    maths.forEach(m => { m.dataset.tex = m.textContent.trim(); });
    if (maths.length) load('katex').then(katex => maths.forEach(m => run(() => {
      katex.render(m.dataset.tex, m, { displayMode: m.tagName !== 'SPAN', throwOnError: false });
      m.classList.add('rendered');
      if (m.tagName !== 'SPAN') fontsReady().then(() => scrollable(m));
    }))).catch(() => {});
  };
  const fitGraph = g => {
    const svg = g.querySelector('svg');
    if (!svg || !g.clientWidth) return;
    const natural = svg.viewBox.baseVal?.width || svg.getBoundingClientRect().width;
    svg.style.maxWidth = 'none';
    svg.style.width = (natural <= g.clientWidth ? natural : Math.max(g.clientWidth - 32, natural / 1.5)) + 'px';
  };
  let drawing = Promise.resolve();
  const drawGraphs = () => drawing = drawing.then(async () => {
    let todo = $$('pre.mermaid').filter(g => g.getClientRects().length && g.dataset.theme !== theme());
    if (!todo.length) return;
    const mermaid = await load('mermaid');
    await fontsReady();
    todo = todo.filter(g => g.getClientRects().length);
    if (!todo.length) return;
    const c = color;
    mermaid.initialize({
      startOnLoad: false, securityLevel: 'strict', theme: 'base', fontFamily: family('--font'),
      themeVariables: {
        darkMode: theme() === 'dark', fontFamily: family('--font'), fontSize: '14px', background: c('plate'), dropShadow: 'none',
        primaryColor: c('card'), primaryTextColor: c('text'), primaryBorderColor: c('line-strong'),
        secondaryColor: c('accent-soft'), secondaryTextColor: c('text'), secondaryBorderColor: c('accent'),
        tertiaryColor: c('sunk'), tertiaryTextColor: c('text'), tertiaryBorderColor: c('line'),
        mainBkg: c('card'), nodeBorder: c('line-strong'), lineColor: c('line-strong'), textColor: c('text'), titleColor: c('text'),
        clusterBkg: c('sunk'), clusterBorder: c('line'), edgeLabelBackground: c('plate'),
        noteBkgColor: c('warn-soft'), noteTextColor: c('text'), noteBorderColor: c('warn'),
        actorBkg: c('card'), actorBorder: c('line-strong'), actorTextColor: c('text'), actorLineColor: c('line-strong'),
        signalColor: c('text'), signalTextColor: c('text'), labelBoxBkgColor: c('card'), labelBoxBorderColor: c('line-strong'),
        labelTextColor: c('text'), loopTextColor: c('text'), activationBkgColor: c('accent-soft'), activationBorderColor: c('accent'),
        sequenceNumberColor: c('on-accent'), altBackground: c('sunk'), compositeBackground: c('card'), compositeTitleBackground: c('sunk'),
        attributeBackgroundColorOdd: c('card'), attributeBackgroundColorEven: c('sunk'),
        pieStrokeColor: c('card'), pieOuterStrokeColor: c('line'), pieTitleTextColor: c('text'), pieSectionTextColor: c('text'), pieLegendTextColor: c('text'),
        ...Object.fromEntries([1, 2, 3, 4, 5, 6, 7, 8].flatMap(i => [[`pie${i}`, c('c' + i)], [`git${i - 1}`, c('c' + i)], [`cScale${i - 1}`, c('c' + i)]])),
      },
    });
    for (const g of todo) {
      g.removeAttribute('data-processed');
      g.classList.remove('rendered');
      g.textContent = g.dataset.src;
      if (await mermaid.parse(g.dataset.src, { suppressErrors: true }) === false) g.dataset.processed = 'invalid';
    }
    await mermaid.run({ nodes: todo.filter(g => !g.dataset.processed), suppressErrors: true });
    todo.forEach(g => { g.dataset.theme = theme(); if (g.querySelector('svg')) { g.classList.add('rendered'); fitGraph(g); scrollable(g); } });
  }).catch(() => {});
  themed.push(drawGraphs);
  d.addEventListener('kit:shown', drawGraphs);
  d.addEventListener('toggle', () => d.dispatchEvent(new Event('kit:shown')), true);
  let resizeTimer;
  addEventListener('resize', () => { clearTimeout(resizeTimer); resizeTimer = setTimeout(() => $$('pre.mermaid').forEach(fitGraph), 150); });

  /* ---------- page ---------- */
  const tips = () => {
    const tip = el('<div class="tip" id="kit-tip" role="tooltip" hidden></div>');
    d.body.append(tip);
    let owner = null, shownAt = 0;
    const place = () => {
      if (!owner) return;
      const r = owner.getBoundingClientRect(), t = tip.getBoundingClientRect();
      tip.style.left = Math.max(8, Math.min(r.left + r.width / 2 - t.width / 2, innerWidth - t.width - 8)) + 'px';
      tip.style.top = (r.bottom + 8 + t.height > innerHeight - 8 ? r.top - t.height - 8 : r.bottom + 8) + 'px';
    };
    const hide = () => { if (!owner) return; owner.removeAttribute('aria-describedby'); owner = null; tip.hidden = true; };
    const show = node => { if (owner === node) return; hide(); owner = node; shownAt = Date.now(); tip.textContent = node.dataset.tip; tip.hidden = false; node.setAttribute('aria-describedby', 'kit-tip'); place(); };
    const term = e => e.target.closest?.('.term[data-tip]');
    d.addEventListener('mouseover', e => { const t = term(e); if (t) show(t); else if (owner && d.activeElement !== owner) hide(); });
    d.addEventListener('focusin', e => { const t = term(e); if (t) show(t); else hide(); });
    d.addEventListener('click', e => { const t = term(e); if (!t) return hide(); if (owner === t && Date.now() - shownAt > 400) hide(); else show(t); });
    d.addEventListener('keydown', e => { if (e.key === 'Escape') hide(); });
    addEventListener('scroll', place, { passive: true });
  };
  const refresh = () => {
    doMath();
    drawGraphs();
    fontsReady().then(() => $$('.scroll, main pre, .json, div.math').forEach(scrollable));
  };
  const slug = (text, taken) => {
    const base = text.trim().toLowerCase().replace(/[^\p{L}\p{N}]+/gu, '-').replace(/^-+|-+$/g, '') || 'section';
    let id = base, n = 2;
    while (taken.has(id)) id = `${base}-${n++}`;
    taken.add(id);
    return id;
  };
  const boot = () => {
    root.classList.add('js');
    try { const saved = sessionStorage.getItem('kit-theme'); if (saved && !root.dataset.theme) root.dataset.theme = saved; } catch {}
    const srcs = $$('script[type="text/viz"]');
    let head = d.querySelector('.page-head'), main = d.querySelector('main');
    if (srcs.length) {
      const nodes = srcs.flatMap((s, k) => {
        const lines = s.textContent.replace(/^\n/, '').replace(/<\\\/script/gi, '</script').split('\n'), cut = Math.min(...lines.filter(l => l.trim()).map(l => l.match(/^\s*/)[0].length));
        return render(lines.map(l => l.slice(cut)).join('\n'), k ? 0 : +window.kitLine0 || 0);
      });
      if (!head) { head = el('<header class="page-head"></header>'); srcs[0].before(head); }
      if (!main) { main = d.createElement('main'); head.after(main); }
      if (nodes[0]?.tagName === 'H1') {
        head.append(nodes.shift());
        if (nodes[0]?.matches('figure.quote')) { const b = el('<div class="brief"></div>'); b.append(...nodes.shift().querySelector('blockquote').childNodes); $$('p', b).forEach(p => { p.style.margin = 0; }); head.append(b); }
      }
      let sec = el('<section class="lead"></section>');
      for (const n of nodes) {
        if (n.tagName === 'H2') { if (sec.childNodes.length) main.append(sec); sec = d.createElement('section'); }
        sec.append(n);
      }
      if (sec.childNodes.length) main.append(sec);
      if (!main.children.length) console.error('kit: the viz source rendered nothing');
    } else if (!main) console.error('kit: no <script type="text/viz"> source and no <main> found');
    if (!head) { head = el('<header class="page-head"></header>'); (main || d.body.firstChild).before(head); }
    const h1 = d.querySelector('h1');
    if (h1 && (!d.title.trim() || d.title === 'Title')) d.title = h1.textContent;
    const taken = new Set($$('[id]').map(n => n.id));
    const heads = $$('main h2');
    $$('main h2, main h3').forEach(h => { if (!h.id) h.id = slug(h.textContent, taken); });

    const tools = el('<div class="tools"></div>');
    const themeBtn = el('<button type="button"></button>');
    const paint = () => {
      const next = theme() === 'dark' ? 'light' : 'dark';
      themeBtn.innerHTML = icon(next);
      themeBtn.setAttribute('aria-label', next === 'dark' ? L.toDark : L.toLight);
      themeBtn.title = themeBtn.getAttribute('aria-label');
    };
    themeBtn.addEventListener('click', () => {
      root.dataset.theme = theme() === 'dark' ? 'light' : 'dark';
      try { sessionStorage.setItem('kit-theme', root.dataset.theme); } catch {}
      paint(); changed();
    });
    dark.addEventListener('change', () => { if (!root.dataset.theme) { paint(); changed(); } });
    paint();
    tools.append(themeBtn);
    head.append(tools);

    const sectionsEl = $$('main > section');
    if (sectionsEl.length > 1) {
      const btn = el(`<button type="button">${icon('present')}</button>`);
      const nav = el(`<nav class="slide-nav" aria-label="${esc(L.slides)}" hidden><button type="button" aria-label="${esc(L.prevSlide)}" title="${esc(L.prevSlide)}">${icon('left', 'flip')}</button><span class="slide-count" aria-live="polite"></span><button type="button" aria-label="${esc(L.nextSlide)}" title="${esc(L.nextSlide)}">${icon('right', 'flip')}</button><button type="button" class="exit" aria-label="${esc(L.exitPresent)}" title="${esc(L.exitPresent)}">${icon('close')}</button></nav>`);
      const [prev, count, next, exit] = nav.children, bar = el('<div class="slide-progress" hidden></div>');
      const deck = () => [head, ...sectionsEl];
      const at = () => { const s = deck(); let best = 0; s.forEach((n, i) => { if (Math.abs(n.getBoundingClientRect().top) < Math.abs(s[best].getBoundingClientRect().top)) best = i; }); return best; };
      let goal = null, timer;
      const mark = () => {
        const i = at(), n = deck().length;
        count.textContent = `${i + 1} / ${n}`;
        prev.setAttribute('aria-disabled', String(i === 0));
        next.setAttribute('aria-disabled', String(i === n - 1));
        bar.style.setProperty('--p', (i + 1) / n);
      };
      const go = (step, to) => {
        const s = deck();
        goal = Math.max(0, Math.min(to ?? (goal ?? at()) + step, s.length - 1));
        s[goal].scrollIntoView();
        clearTimeout(timer);
        timer = setTimeout(() => { goal = null; }, 600);
      };
      const set = on => {
        root.classList.toggle('slides', on);
        nav.hidden = bar.hidden = !on;
        btn.setAttribute('aria-pressed', String(on));
        btn.setAttribute('aria-label', on ? L.exitPresent : L.present);
        btn.title = btn.getAttribute('aria-label');
        if (on) mark();
        d.dispatchEvent(new Event('kit:shown'));
      };
      btn.addEventListener('click', () => set(!root.classList.contains('slides')));
      prev.addEventListener('click', () => go(-1));
      next.addEventListener('click', () => go(1));
      exit.addEventListener('click', () => { set(false); btn.focus(); });
      addEventListener('scroll', () => { if (!nav.hidden) mark(); }, { passive: true });
      d.addEventListener('keydown', e => {
        if (!root.classList.contains('slides') || e.target.closest('input, select, textarea, [role="tab"], [contenteditable]') || e.altKey || e.ctrlKey || e.metaKey) return;
        if (e.key === 'Escape') return set(false);
        const step = { ArrowRight: 1, PageDown: 1, ArrowLeft: -1, PageUp: -1 }[e.key], to = { Home: 0, End: deck().length - 1 }[e.key];
        if (!step && to === undefined) return;
        e.preventDefault();
        go(step, to);
      });
      tools.prepend(btn);
      d.body.append(bar, nav);
      set(root.classList.contains('slides'));
    }

    if (main && heads.length >= 4) run(() => {
      const nav = el(`<nav class="toc" aria-label="${esc(L.contents)}"><details><summary>${icon('list')}<span>${esc(L.contents)}</span><small></small>${icon('down', 'toc-chev')}</summary><ol></ol></details></nav>`);
      const links = heads.map(h => { const li = el(`<li><a href="#${h.id}"></a></li>`); li.firstChild.textContent = h.textContent; nav.querySelector('ol').append(li); return li.firstChild; });
      main.before(nav);
      const details = nav.firstElementChild, wide = matchMedia('(min-width: 80rem)'), where = nav.querySelector('small');
      const fit = () => { details.open = wide.matches; details.firstElementChild.tabIndex = wide.matches ? -1 : 0; };
      fit();
      wide.addEventListener('change', fit);
      links.forEach(a => a.addEventListener('click', () => { if (!wide.matches) details.open = false; }));
      let ticking = false;
      const spy = () => {
        ticking = false;
        let cur = -1;
        heads.forEach((h, i) => { if (h.getBoundingClientRect().top < innerHeight * 0.3) cur = i; });
        links.forEach((a, i) => i === cur ? a.setAttribute('aria-current', 'true') : a.removeAttribute('aria-current'));
        where.textContent = cur < 0 ? heads.length : `${cur + 1} / ${heads.length}`;
      };
      addEventListener('scroll', () => { if (!ticking) { ticking = true; requestAnimationFrame(spy); } }, { passive: true });
      spy();
    });

    run(tips);
    refresh();
    d.dispatchEvent(new Event('kit:ready'));
  };

  addEventListener('beforeprint', () => $$('details:not([open])').forEach(n => { if (!n.closest('.toc, .data')) { n.open = true; n.dataset.printOpen = ''; } }));
  addEventListener('afterprint', () => $$('details[data-print-open]').forEach(n => { n.open = false; delete n.dataset.printOpen; }));

  window.kit = { render, md, blocks: B, containers: C, color, theme, load, refresh, labels: L };
  if (d.readyState === 'loading') d.addEventListener('DOMContentLoaded', boot); else boot();
})();
</script>
</body>
</html>
